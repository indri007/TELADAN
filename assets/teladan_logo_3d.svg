<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <!-- M3 Gradients -->
    <linearGradient id="bgM3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071927"/>
      <stop offset="50%" stop-color="#0F2B46"/>
      <stop offset="100%" stop-color="#1E3A5F"/>
    </linearGradient>

    <linearGradient id="m3Gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE885"/>
      <stop offset="45%" stop-color="#E5B83B"/>
      <stop offset="75%" stop-color="#C9A227"/>
      <stop offset="100%" stop-color="#8C6A0D"/>
    </linearGradient>

    <linearGradient id="goldGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFE484" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#C9A227" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="centralLight" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#C9A227" stop-opacity="0.35"/>
      <stop offset="40%" stop-color="#0F2B46" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#071927" stop-opacity="0"/>
    </radialGradient>

    <!-- Material 3 Filters & 3D Lighting -->
    <filter id="m3ElevatedShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.55"/>
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#C9A227" flood-opacity="0.25"/>
    </filter>

    <filter id="goldSpecular">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feSpecularLighting result="spec" in="blur" specularConstant="1.4" specularExponent="22" lighting-color="#FFF5CC">
        <fePointLight x="250" y="100" z="220"/>
      </feSpecularLighting>
      <feComposite in="SourceGraphic" in2="spec" operator="arithmetic" k1="0" k2="1" k3="1" k4="0"/>
    </filter>

    <filter id="neonPulse">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes orbit3d {
      0% { transform: rotate(0deg) scale(1); }
      50% { transform: rotate(180deg) scale(1.03); }
      100% { transform: rotate(360deg) scale(1); }
    }
    @keyframes orbitCounter {
      0% { transform: rotate(360deg); }
      100% { transform: rotate(0deg); }
    }
    @keyframes float3d {
      0%, 100% { transform: translateY(0px) rotateX(0deg); }
      50% { transform: translateY(-10px) rotateX(4deg); }
    }
    @keyframes pulseAura {
      0%, 100% { opacity: 0.35; transform: scale(0.98); }
      50% { opacity: 0.65; transform: scale(1.03); }
    }
    @keyframes shimmerGold {
      0% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: 600; }
    }

    .orbital-ring {
      transform-origin: 400px 210px;
      animation: orbit3d 24s linear infinite;
    }
    .orbital-ring-2 {
      transform-origin: 400px 210px;
      animation: orbitCounter 32s linear infinite;
    }
    .hero-emblem {
      transform-origin: 400px 210px;
      animation: float3d 6s ease-in-out infinite;
    }
    .aura {
      transform-origin: 400px 210px;
      animation: pulseAura 4s ease-in-out infinite;
    }
    .laser-border {
      stroke-dasharray: 80 120;
      animation: shimmerGold 12s linear infinite;
    }
  </style>

  <!-- Background Base Container -->
  <rect width="800" height="500" rx="28" fill="url(#bgM3)"/>
  <circle cx="400" cy="210" r="230" fill="url(#centralLight)" class="aura"/>

  <!-- Orbital Navigation Rings (Material 3 Gyroscope) -->
  <g class="orbital-ring">
    <ellipse cx="400" cy="210" rx="195" ry="75" fill="none" stroke="url(#m3Gold)" stroke-width="1.8" stroke-dasharray="14 12" opacity="0.6"/>
    <circle cx="205" cy="210" r="5" fill="#FFE885" filter="url(#neonPulse)"/>
    <circle cx="595" cy="210" r="6" fill="#C9A227" filter="url(#neonPulse)"/>
  </g>

  <g class="orbital-ring-2">
    <ellipse cx="400" cy="210" rx="180" ry="95" fill="none" stroke="#60A5FA" stroke-width="1.2" stroke-dasharray="8 14" opacity="0.45" transform="rotate(-30 400 210)"/>
    <circle cx="400" cy="115" r="4.5" fill="#93C5FD" filter="url(#neonPulse)"/>
    <circle cx="400" cy="305" r="4.5" fill="#38BDF8" filter="url(#neonPulse)"/>
  </g>

  <!-- Central 3D Emblem with Depth & Elevation -->
  <g class="hero-emblem" filter="url(#m3ElevatedShadow)">
    
    <!-- Outer Shield Depth Layer (3D Extrusion) -->
    <path d="M400 55 L555 125 L555 240 C555 330 485 395 400 425 C315 395 245 330 245 240 L245 125 Z"
          fill="#061320" transform="translate(0, 10)"/>

    <!-- Main Shield Surface -->
    <path d="M400 55 L555 125 L555 240 C555 330 485 395 400 425 C315 395 245 330 245 240 L245 125 Z"
          fill="url(#bgM3)" stroke="url(#m3Gold)" stroke-width="3.5" filter="url(#goldSpecular)"/>

    <!-- Inner Metallic Contour Ring -->
    <path d="M400 75 L538 138 L538 238 C538 316 476 374 400 402 C324 374 262 316 262 238 L262 138 Z"
          fill="none" stroke="url(#m3Gold)" stroke-width="1.5" class="laser-border" opacity="0.75"/>

    <!-- Shield Specular Lighting Arc -->
    <path d="M400 78 L534 140 C534 220 480 270 400 280 C320 270 266 220 266 140 Z"
          fill="url(#goldGlow)" opacity="0.12"/>

    <!-- 3D Star of Evidence / Compass Rose at Top -->
    <g transform="translate(400, 115)">
      <polygon points="0,-22 6,-6 22,0 6,6 0,22 -6,6 -22,0 -6,-6" fill="url(#m3Gold)" filter="url(#neonPulse)"/>
      <circle cx="0" cy="0" r="3" fill="#FFFFFF"/>
    </g>

    <!-- Open Book of Literature -->
    <g transform="translate(400, 192)">
      <!-- Left Page -->
      <path d="M-8 -26 L-64 -18 C-64 -18 -66 28 -60 38 L-8 28 Z" fill="#F8FAFC" stroke="url(#m3Gold)" stroke-width="1.8"/>
      <!-- Right Page -->
      <path d="M8 -26 L64 -18 C64 -18 66 28 60 38 L8 28 Z" fill="#E2E8F0" stroke="url(#m3Gold)" stroke-width="1.8"/>
      <!-- Spine Pivot -->
      <path d="M-8 -26 L0 -30 L8 -26 L8 28 L0 32 L-8 28 Z" fill="url(#m3Gold)"/>
      <!-- Page Inscription Lines -->
      <line x1="-52" y1="-7" x2="-18" y2="-12" stroke="#94A3B8" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="-52" y1="4" x2="-18" y2="-1" stroke="#94A3B8" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="-52" y1="15" x2="-18" y2="10" stroke="#94A3B8" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="18" y1="-12" x2="52" y2="-7" stroke="#64748B" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="18" y1="-1" x2="52" y2="4" stroke="#64748B" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="18" y1="10" x2="52" y2="15" stroke="#64748B" stroke-width="1.5" stroke-linecap="round"/>
    </g>

    <!-- Balances of Truth & Systematic Review (Scale) -->
    <g transform="translate(400, 268)">
      <!-- Main Brass Pillar -->
      <rect x="-3" y="-22" width="6" height="48" rx="3" fill="url(#m3Gold)"/>
      <!-- Sturdy Tiered Pedestal -->
      <rect x="-24" y="24" width="48" height="6" rx="3" fill="url(#m3Gold)"/>
      <rect x="-16" y="20" width="32" height="4" rx="2" fill="#8C6A0D"/>
      <!-- Fulcrum Crossbeam -->
      <path d="M-52 -20 L0 -24 L52 -20" stroke="url(#m3Gold)" stroke-width="3.5" stroke-linecap="round"/>
      <circle cx="0" cy="-24" r="4" fill="#FFE885"/>

      <!-- Left Scale Pan (Evidence) -->
      <line x1="-50" y1="-19" x2="-62" y2="8" stroke="url(#m3Gold)" stroke-width="1.4"/>
      <line x1="-50" y1="-19" x2="-38" y2="8" stroke="url(#m3Gold)" stroke-width="1.4"/>
      <path d="M-66 8 Q-50 17 -34 8 Z" fill="url(#m3Gold)" opacity="0.95"/>

      <!-- Right Scale Pan (Decisions) -->
      <line x1="50" y1="-19" x2="38" y2="8" stroke="url(#m3Gold)" stroke-width="1.4"/>
      <line x1="50" y1="-19" x2="62" y2="8" stroke="url(#m3Gold)" stroke-width="1.4"/>
      <path d="M34 8 Q50 17 66 8 Z" fill="url(#m3Gold)" opacity="0.95"/>
    </g>

    <!-- Network Topology Nodes (Analytics AI) -->
    <g transform="translate(400, 342)">
      <circle cx="-50" cy="0" r="5" fill="#38BDF8" filter="url(#neonPulse)"/>
      <circle cx="50" cy="0" r="5" fill="#38BDF8" filter="url(#neonPulse)"/>
      <circle cx="0" cy="18" r="6" fill="#FFE885" filter="url(#neonPulse)"/>
      <line x1="-50" y1="0" x2="0" y2="18" stroke="#38BDF8" stroke-width="1.2" stroke-dasharray="3 3"/>
      <line x1="50" y1="0" x2="0" y2="18" stroke="#38BDF8" stroke-width="1.2" stroke-dasharray="3 3"/>
    </g>

  </g>

  <!-- Typography: TELADAN Title with Golden Gradient & Shadow -->
  <text x="400" y="446" text-anchor="middle"
        font-family="'Playfair Display', 'Cinzel', Georgia, serif"
        font-size="34" font-weight="900" letter-spacing="8"
        fill="url(#m3Gold)" filter="url(#goldSpecular)">
    TELADAN
  </text>

  <!-- Tagline: Material 3 Monospace Subhead -->
  <text x="400" y="475" text-anchor="middle"
        font-family="'Inter', -apple-system, sans-serif"
        font-size="11.5" font-weight="600" letter-spacing="4"
        fill="#94A3B8" opacity="0.9">
    EVIDENCE · ANALYTICS · DECISION AUTOMATION
  </text>
</svg>
